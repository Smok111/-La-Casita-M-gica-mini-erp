spring.application.name=MagicHouse-miniERP
server.port=8080

#JPA Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

#Database connection
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/MagicHouseDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456789a

jwt.secret=MagiHouse-Super-Secret-Key-For-JWT-Authentication-2026-Secure-Random-String